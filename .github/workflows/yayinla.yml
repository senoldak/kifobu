# Siteyi GitHub Actions'ta derleyip Cloudflare'e gönderir; Cloudflare'in ücretsiz derleme dakikası harcanmaz.
# Elle yapılan push'larda içerik ya da site kodu değiştiyse kendiliğinden çalışır. Botun push'u (GITHUB_TOKEN)
# push tetiklemediği için bot, yeni haber yazdığında bu iş akışını "gh workflow run" ile başlatır.
# "[skip ci]" içeren commit'ler (yalnız durum dosyası) yayın başlatmaz.
name: Yayınla

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read

# Sırada bekleyen yayın varsa eskisi iptal edilir; her yayın dalın en son hâlini derler.
concurrency:
  group: yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Kapak PNG önbelleği (src/lib/kapak-onbellek.mjs): kapaklar her derlemede yeniden çizilip derlemenin ~%75'ini
      # alıyordu ve haber sayısıyla büyüyordu. Anahtar tasarım dosyalarının özetini taşır (tasarım değişince hepsi
      # yeniden çizilir) ve her koşuda yeni sürüm kaydeder; restore-keys en sonunu getirir. Önbellek yoksa eskisi gibi çizer.
      - name: Kapak önbelleği
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kapak-onbellek
          key: kapak-${{ hashFiles('src/kapak/**', 'src/lib/kapak-onbellek.mjs') }}-${{ github.run_id }}
          restore-keys: kapak-${{ hashFiles('src/kapak/**', 'src/lib/kapak-onbellek.mjs') }}-

      - name: Derle
        run: npm run build

      - name: Kapak önbelleği sayısı
        run: |
          n=$(ls .kapak-onbellek 2>/dev/null | wc -l)
          echo "kapak önbelleği: $n PNG" >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare'e gönder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.34.0 deploy

      # Cloudflare ücretsiz planında bir sürüm en fazla 20.000 dosya olabilir; sınıra yaklaşınca uyarır.
      - name: Dosya sayısı
        run: |
          n=$(find dist -type f | wc -l)
          echo "dist: $n dosya (sınır 20.000)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 15000 ]; then echo "::warning::dist $n dosya; Cloudflare ücretsiz sınırı 20.000"; fi

      # Yeni haberleri arama motorlarına bildirir (IndexNow: Bing, Yandex, Seznam, Naver). Başarısız olsa da yayını düşürmez.
      - name: IndexNow bildirimi
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs

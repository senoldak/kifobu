# Sveltia CMS ayarları: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: senoldak/kifobu
  branch: main

site_url: https://kifobu.com
display_url: https://kifobu.com
locale: tr

# Yüklenen resimler varsayılan olarak buraya gider (haber kapakları haberin kendi klasörüne kaydedilir).
media_folder: /public/uploads
public_folder: /uploads

# Resimler yüklenirken otomatik olarak WebP'ye çevrilir ve küçültülür.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: haberler
    label: Haberler
    label_singular: Haber
    folder: src/content/haberler
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{title}}'
    summary: '{{title}} · {{date | date("DD.MM.YYYY HH:mm")}}'
    sortable_fields:
      fields: [date, title, category]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: Manşet, field: featured, pattern: true }
      - { label: Son dakika, field: breaking, pattern: true }
      - { label: Taslaklar, field: draft, pattern: true }
    view_groups:
      - { label: Kategori, field: category }
    fields:
      - { name: title, label: Başlık, widget: string }
      - name: description
        label: Spot (özet)
        widget: text
        hint: Anasayfada ve paylaşımlarda görünen 1-2 cümlelik özet.
      - name: category
        label: Kategori
        widget: select
        default: gunluk-bulten
        options:
          - { label: Günlük Bülten, value: gunluk-bulten }
          - { label: Kampanyalar, value: kampanyalar }
          - { label: Platformlar, value: platformlar }
          - { label: Yatırımlar, value: yatirimlar }
          - { label: Girişimler, value: girisimler }
          - { label: Mevzuat, value: mevzuat }
          - { label: Analiz, value: analiz }
          # Emekli bölümler (2026-10-15): yeni haber girmeyin; eski haberler için duruyor.
          - { label: Gündem (eski), value: gundem }
          - { label: Yapay Zekâ (eski), value: yapay-zeka }
          - { label: Donanım (eski), value: donanim }
          - { label: Dünya (eski), value: dunya }
      - { name: date, label: Yayın tarihi, widget: datetime, default: '{{now}}', input_timezone: Europe/Istanbul }
      - { name: updated, label: Güncelleme tarihi, widget: datetime, required: false, input_timezone: Europe/Istanbul, hint: 'Haberde içerik düzeltmesi ya da ekleme yapıldıysa doldurun; arama motorlarına değişiklik tarihi olarak bildirilir.' }
      - { name: cover, label: Kapak resmi, widget: image, required: false }
      - { name: coverAlt, label: Resim açıklaması, widget: string, required: false }
      - { name: author, label: Yazar, widget: string, default: kifobu }
      - name: girisim
        label: Girişim
        widget: string
        required: false
        hint: Kampanya haberiyse doldurun. Girişim ve toplanan tutar doluysa haber anasayfadaki tahtaya yazılır.
      - { name: platform, label: Platform, widget: string, required: false, hint: "Örn. Fonbulucu, Fonlabüyüsün, Arıkovanı" }
      - { name: toplanan, label: Toplanan tutar, widget: number, value_type: int, min: 0, required: false }
      - { name: hedef, label: Hedef tutar, widget: number, value_type: int, min: 1, required: false }
      - { name: yatirimci, label: Yatırımcı sayısı, widget: number, value_type: int, min: 0, required: false }
      - name: paraBirimi
        label: Para birimi
        widget: select
        default: TRY
        options:
          - { label: Türk lirası (₺), value: TRY }
          - { label: ABD doları ($), value: USD }
          - { label: Avro (€), value: EUR }
          - { label: Sterlin (£), value: GBP }
      - { name: tur, label: Yatırım turu, widget: string, required: false, hint: "Örn. Tohum, Seri A" }
      - { name: yatirimcilar, label: Yatırımcılar, widget: string, required: false, hint: "Yatırım yapan fonlar / melek yatırımcılar" }
      - { name: kaynakAd, label: Kaynak adı, widget: string, required: false }
      - { name: kaynakUrl, label: Kaynak bağlantısı, widget: string, required: false }
      # Botun yazdığı haberde kaynakların şifreli kaydı (scripts/bot/gizli.mjs); düzenlenmez, kaydederken korunur.
      - { name: kaynakIzi, label: Kaynak izi, widget: hidden, required: false }
      - name: uretim
        label: Üretim
        widget: select
        default: editor
        options:
          - { label: Editör, value: editor }
          - { label: Yapay zekâ (bot), value: yapay-zeka }
      - name: durum
        label: Kampanya durumu
        widget: select
        required: false
        options:
          - { label: Yeni açıldı, value: yeni }
          - { label: Sürüyor, value: suruyor }
          - { label: Hedefe ulaştı, value: basarili }
          - { label: Hedefe ulaşamadan kapandı, value: basarisiz }
      - name: featured
        label: Manşet
        widget: boolean
        default: false
        hint: Açıksa anasayfanın en üstünde büyük olarak gösterilir.
      - name: breaking
        label: Son dakika
        widget: boolean
        default: false
        hint: Açıksa anasayfadaki tahtanın son satırında "Son dakika" olarak gösterilir.
      - name: draft
        label: Taslak
        widget: boolean
        default: false
        hint: Açıksa haber sitede yayınlanmaz.
      - name: noindex
        label: Arama motorlarına kapalı
        widget: boolean
        default: false
        hint: Açıksa haber sitede kalır ama arama motorlarına kapalıdır ve site haritasına girmez. 120 kelimeden kısa haberler kendiliğinden kapalıdır.
      - { name: body, label: Haber metni, widget: markdown }
